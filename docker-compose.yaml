services:
  mongodb:
    image: mongo:7.0
    container_name: notification-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - notification-network
    healthcheck:
      test: ["CMD-SHELL", "echo \"try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }\" | mongosh --port 27017 --quiet || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
#    environment:
#      - MONGO_URI=${MONGO_URI}
#      - RABBITMQ_URI=${RABBITMQ_URI}
#      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
#      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
#      - AWS_REGION=${AWS_REGION}
#      - AWS_SES_SENDER=${AWS_SES_SENDER}
#      - ENVIRONMENT=${ENVIRONMENT:-development}
#      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - notification-network
      - microblogging-network
    restart: on-failure

volumes:
  mongodb_data:

networks:
  notification-network:
    driver: bridge
  microblogging-network:
    external: true
